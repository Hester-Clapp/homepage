<svg width="16rem" height="16rem" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- background -->
  <rect width="256" height="256" fill="#222"/>
  
  <!-- broken image frame -->
  <rect x="48" y="64" width="160" height="120" rx="4" fill="none" stroke="#444" stroke-width="4"/>
  
  <!-- mountain/landscape that would have been in the image -->
  <polyline points="68,164 108,104 138,140 158,116 188,164" fill="none" stroke="#333" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- sun circle -->
  <circle cx="168" cy="96" r="16" fill="none" stroke="#333" stroke-width="4"/>
  
  <!-- diagonal break line across the frame -->
  <line x1="48" y1="64" x2="208" y2="184" stroke="#444" stroke-width="3" stroke-linecap="round"/>
</svg>