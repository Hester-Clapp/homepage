<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>LZ77 Encoding</title>
    <style>
        p {
            font-size: larger;
        }

        span.pointer {
            font-size: xx-small;
            vertical-align: super;
        }
    </style>
</head>

<body>
    <input type="input">
    <p id="output"></p>
</body>
<script>
    const alphabet = "abcdefghijklmnopqrstuvwxyz"

    Array.prototype.removeDuplicates = function () {
        return [...new Set(this)]
    }
    Array.prototype.frequencies = function () {
        return this.reduce((acc, v) => { // Count item frequencies
            acc[v] = (acc[v] || 0) + 1
            return acc
        }, {})
    }
    Array.prototype.mostFrequentItem = function () {
        let obj = this.frequencies()
        let substring
        if (this.length) substring = this.reduce((maxKey, currentKey) => obj[currentKey] > obj[maxKey] ? currentKey : maxKey)
        if (obj[substring] > 1) return substring
        return null
    }

    let input = document.querySelector("input")
    input.addEventListener("input", () => {
        console.clear()
        let text = input.value.replace(/[\.\*\+\?\^\$\{\}\(\)\|\[\]\\]/g, "")
        let pointers = {}
        let remainder = text
        let replacement = { changed: true }
        while (replacement.changed) {
            replacement = replaceLongestSubstring(remainder)
            Object.assign(pointers, replacement.pointers)
            remainder = replacement.remainder
        }
        document.getElementById("output").innerHTML = render(text, pointers)
    })

    function nextSubstring(text, substring) {
        let matches = text.match(new RegExp(`${substring}.`, "g")) // Find longer substrings
        return matches ? matches.mostFrequentItem() : null // Find the most frequent substring that occurs more than once
    }

    function findLongestSubstring(text) {
        let substring = text.replace(/\#/g, "")
            .split("")
            .removeDuplicates()
        let longer = [...substring]
        do {
            substring = [...longer] // Store a copy of the previous longest substrings
            longer = substring.map(v => nextSubstring(text, v)).filter(v => v) // Search a level deeper
        } while (longer.length) // Stop if nothing longer can be found
        return substring[0]
    }

    function replaceLongestSubstring(text) {
        let substring = findLongestSubstring(text)
        console.log(text, `"${substring}"`)
        let pointers = {}
        let remainder = text
        // let matchRegex = new RegExp(`(?<=${substring}.*)${substring}`) // Match subsequent instances of the substring
        // let matchRegexGlobal = new RegExp(`(?<=${substring}.*)${substring}`, "g")
        let matchRegexGlobal = new RegExp(substring, "g")

        if (substring?.length > 2) {

            let numMatches = text.match(new RegExp(substring, "g")).length
            let firstSubstringIndex = -1

            remainder = text.replace(matchRegexGlobal, (match, i) => {
                if (firstSubstringIndex === -1) { // If this is the first match
                    firstSubstringIndex = i
                    return match
                } else {
                    if (pointers?.[i]?.length > substring.length) return match // Do not add a pointer if another pointer already exists
                    pointers[i] = { index: firstSubstringIndex, length: substring.length }
                    return "#".repeat(substring.length)
                }
            })
        }
        return { pointers, remainder/*: remainder.replace(/#/g, "")*/, changed: Object.keys(pointers).length }
    }

    function render(text, pointers) {
        let array = text.split("")
            .map((v, i) => `<span style="color: ${randomColour(i)};">${v}</span>`)
        Object.keys(pointers).forEach(index => {
            let i = Number(index)
            let pointer = pointers[i].index
            let length = pointers[i].length
            let substring = text.slice(pointer, pointer + length)
            array[i] = `<span class="pointer" style="color: ${randomColour(pointer)};">${substring}</span>`
            for (let j = 1; j < pointers[i].length; j++) {
                delete array[i + j]
            }

            // array.splice(i, length, `<ruby style="color: ${randomColour(pointer)};">${"^"}<rt>${substring}</rt></ruby>`)
        })
        return array.join("")
    }

    function hash(seed) {
        let hash = seed
        hash = ((hash >> 16) ^ hash) * 0x45d9f3b
        hash = ((hash >> 16) ^ hash) * 0x45d9f3b
        hash = (hash >> 16) ^ hash
        return hash & 0xFFFFFF // Restrict to 24 bits for RGB
    }

    function randomColour(seed) { // Generated by ChatGPT
        let h = hash(seed)
        const r = (h & 0xFF0000) >> 16; // Extract red component
        const g = (h & 0x00FF00) >> 8;  // Extract green component
        const b = h & 0x0000FF;         // Extract blue component

        // Ensure legibility on a white background by adjusting brightness
        const brightness = 0.2126 * r + 0.7152 * g + 0.0722 * b; // Relative luminance formula
        const adjustmentFactor = brightness < 128 ? 1.5 : 0.5;

        const adjustedR = Math.min(255, Math.floor(r * adjustmentFactor));
        const adjustedG = Math.min(255, Math.floor(g * adjustmentFactor));
        const adjustedB = Math.min(255, Math.floor(b * adjustmentFactor));

        return `rgb(${adjustedR}, ${adjustedG}, ${adjustedB})`;
    }

</script>
