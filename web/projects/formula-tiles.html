<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula Tiles</title>
    <style>
        * {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1 {
            margin-bottom: 4rem;
        }

        .grid {
            display: grid;
            gap: 1ch 1ch;
            grid-auto-rows: 1fr;
            padding: 1ch;
            width: 20rem;
            font-size: larger;
            font-weight: 700;

            * {
                width: 100%;
                min-height: 3rem;
                border-radius: 1ch;
                text-align: center;
                align-content: center;
                transition: filter 0.25s;
            }

        }

        .grid:has(div:hover)>div {
            filter: brightness(0.5)
        }

        div.grid>div:hover {
            filter: brightness(1);
        }

        .Charge {
            background-color: crimson;
            color: white;
        }

        .Current {
            background-color: orange;
        }

        .Electric-Flux {
            background-color: royalblue;
            color: white;
        }

        .Voltage {
            background-color: mediumpurple;
        }

        .Resistance {
            background-color: lightslategrey;
        }

        .Capacitance {
            background-color: mediumseagreen;
        }

        .Power {
            background-color: teal;
            color: white;
        }

        .Energy {
            background-color: gold;
        }

        .Force {
            background-color: seagreen;
        }

        .Distance {
            background-color: cornflowerblue;
        }

        .Time {
            background-color: hotpink;
        }

        .Mass {
            background-color: saddlebrown;
            color: white;
        }

        .Velocity {
            background-color: limegreen;
        }

        .Acceleration {
            background-color: crimson;
            color: white;
        }

        .Momentum {
            background-color: rebeccapurple;
            color: white;
        }
    </style>
</head>

<body>
    <div style="display: flex; width: 100%;">
        <div style="width: 50%;">
            <h1>Mechanics</h1>
            <div class="grid" id="Work">
                <div class="Energy" style="grid-area: 1/1/2/6">E</div>
                <div class="Power" style="grid-area: 2/1/3/5">P</div>
                <div class="Time" style="grid-area: 2/5/4/6">t</div>
                <div class="Force" style="grid-area: 3/1/6/3">F</div>
                <div class="Velocity" style="grid-area: 3/3/4/5">v</div>
                <div class="Distance" style="grid-area: 4/3/5/6">d</div>
                <div class="Time" style="grid-area: 5/3/7/4">t</div>
                <div class="Acceleration" style="grid-area: 5/4/7/5">a</div>
                <div class="Time" style="grid-area: 5/5/7/6">t</div>
                <div class="Mass" style="grid-area: 6/1/8/2">m</div>
                <div class="Acceleration" style="grid-area: 6/2/7/3">a</div>
                <div class="Velocity" style="grid-area: 7/2/8/4">v</div>
                <div class="Momentum" style="grid-area: 8/1/9/4">p</div>
                <div class="Velocity" style="grid-area: 7/4/9/6">v</div>
            </div>
        </div>
        <div style="width: 50%;">
            <h1>Electricity</h1>
            <h2>Electric Conductors</h2>
            <div class="grid" id="Electricity">
                <div class="Energy" style="grid-area: 1/1/2/5">E</div>
                <div class="Time" style="grid-area: 2/1/5/2">t</div>
                <div class="Power" style="grid-area: 2/2/3/5">P</div>
                <div class="Current" style="grid-area: 3/2/5/3">I</div>
                <div class="Current" style="grid-area: 3/3/4/4">I</div>
                <div class="Resistance" style="grid-area: 3/4/4/5">R</div>
                <div class="Charge" style="grid-area: 5/1/6/3">Q</div>
                <div class="Voltage" style="grid-area: 4/3/6/5">V</div>
            </div>
            <h2>Capacitors</h2>
            <div class="grid" id="Capacitors">
                <div class="Energy" style="grid-area: 1/1/2/4">E</div>
                <div class="Voltage" style="grid-area: 2/1/4/2">V</div>
                <div class="Charge" style="grid-area: 2/2/3/4">Q</div>
                <div class="Voltage" style="grid-area: 3/2/4/3">V</div>
                <div class="Capacitance" style="grid-area: 3/3/4/4">C</div>
            </div>
            <h2>Electric Field</h2>
            <div class="grid" id="Electric-Field">
                <div class="Charge" style="grid-area: 1/1/1/4">Q</div>
                <div class="Charge" style="grid-area: 1/4/4/5">q</div>
                <div class="Distance" style="grid-area: 2/1/6/1">r</div>
                <div class="Voltage" style="grid-area: 2/2/2/4">V</div>
                <div class="Distance" style="grid-area: 3/2/5/2">r</div>
                <div class="Electric-Flux" style="grid-area: 3/3/4/4">E</div>
                <div class="Force" style="grid-area: 4/3/4/5">F</div>
                <div class="Energy" style="grid-area: 5/2/5/5">Energy</div>
            </div>
        </div>
    </div>
</body>

</html>
