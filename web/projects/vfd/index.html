<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variable Frequency Drive Simulator</title>
</head>

<body>
    <input type="range" min="0" max="100" value="0" id="slider">
</body>
<script>
    // 1 m/s = 15 rad/s
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const bufferSize = 1 * audioCtx.sampleRate; // 2 seconds

    class Synth {
        constructor(startFrequencies, endFrequencies) {
            this.startFrequencies = startFrequencies;
            if (typeof endFrequencies === 'number') {
                this.endFrequencies = startFrequencies.map(freq => freq * endFrequencies);
            } else if (Array.isArray(endFrequencies)) {
                this.endFrequencies = endFrequencies;
            } else {
                throw new Error("endFrequencies must be a number or an array of numbers");
            }
            this.oscillators = [];
            this.gainNode = audioCtx.createGain();

            startFrequencies.forEach((freq, i) => {
                const oscillator = audioCtx.createOscillator();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
                this.oscillators.push(oscillator);
            });
        }
        lerp(t) {
            this.oscillators.forEach((oscillator, i) => {
                oscillator.frequency.setValueAtTime(this.startFrequencies[i] * (1 - t) + this.endFrequencies[i] * t, audioCtx.currentTime);
            });
        }
        start() {
            this.oscillators.forEach((oscillator, i) => {
                oscillator.connect(this.gainNode);
                oscillator.start();
            });
            this.gainNode.connect(audioCtx.destination);
        }
    }

    let tractionModes = parseTractionModes("async 1000 < 60, sync 9 < 100, sync 7 < 140, sync 5 < 200, sync 3 < 300, sync 1");
    function parseTractionModes(string) {
        let modes = string.replaceAll(/<( *)/g, "<").split(", ");
        let output = []
        for (let desc of modes) {
            let parts = desc.split(" ");
            if (parts[0] === "async") {
                output.push({
                    type: "async",
                    carrierFrequency: Number(parts[1]),
                    maxFrequency: Number(parts[2].slice(1)),
                });
            } else if (parts[0] === "sync") {
                output.push({
                    type: "sync",
                    pulsesPerCycle: Number(parts[1]) * 2,
                    maxFrequency: parts?.[2] ? Number(parts[2].slice(1)) : undefined,
                });
            }
        }
        output.forEach((mode, i) => {
            if (i === 0) mode.minFrequency = 0;
            else mode.minFrequency = output[i - 1].maxFrequency;
        })
    }

    let motor = new Synth(
        [520, 620, 820, 920, 1200, 1400, 1500, 1800],
        1.13,
    );

    let slider = document.querySelector("input[type=range]");
    slider.addEventListener("input", (e) => {
        let t = parseInt(e.target.value) / 100;
        motor.lerp(t);

    })

    function play() {
        motor.start();
        let t = 0
        let interval = setInterval(() => {
            t += 0.02
            motor.lerp(t);
        }, 100);
        setTimeout(() => {
            clearInterval(interval);
            motor.oscillators.forEach(oscillator => oscillator.stop());
            audioCtx.close();
        }, 10000);
    }
</script>

</html>
