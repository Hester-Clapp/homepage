<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boodschappenlijst</title>
    <style>
        * {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.25rem;
        }

        body {
            margin: 0;
            background-image: url("./metal.png");
            background-repeat: repeat;
        }

        #items {
            display: block;
            padding-bottom: 4rem;
            height: fit-content;
            list-style: none;

            li {
                font-weight: 600;
                text-shadow: 0 0 0.2rem grey;
                cursor: pointer;
            }
        }

        li.strikethrough {
            text-decoration: line-through;
        }

        #newItemForm {
            position: fixed;
            bottom: 0;
            padding: 1rem;
            background-color: blue;
            box-sizing: border-box;
            box-shadow: inset 0 0 0.4rem black;
            width: 100%;

            div {
                display: flex;
                width: 100%;
                box-shadow: 0 0 0.4rem black;
                border-radius: 0.5rem;

                input {
                    flex: 1;
                    padding: 0.25rem;
                    border: none;
                    border-radius: 0.5rem 0 0 0.5rem;
                    background-color: #e0e0e0;
                    background-repeat: repeat;
                    box-shadow: inset 0 0 0.2rem black;
                }

                input:focus {
                    outline: none;
                    background-color: #ffffff;
                }

                button {
                    display: inline-block;
                    position: relative;
                    width: 2.25rem;
                    padding: 0;

                    font-size: 1.5rem;
                    /* padding: 0.25rem 0.5rem; */
                    border: none;
                    border-radius: 0 0.5rem 0.5rem 0;
                    background-color: limegreen;
                    cursor: pointer;

                    box-shadow: inset -1px -1px 0.4rem black;

                    /* tweakable variables */
                    --cross-size: 60%;
                    /* length of each bar relative to the square */
                    --thickness: 12%;
                    /* thickness of the bars */
                }

                button:active {
                    box-shadow: inset 1px 1px 0.4rem black;
                }

                button::before,
                button::after {
                    content: "";
                    position: absolute;
                    left: 50%;
                    top: 50%;
                    transform: translate(-50%, -50%);
                    background: currentColor;
                    border-radius: 1px;
                    /* optional, soft edges */
                }

                /* horizontal bar */
                button::before {
                    width: var(--cross-size);
                    height: var(--thickness);
                }

                /* vertical bar */
                button::after {
                    width: var(--thickness);
                    height: var(--cross-size);
                }
            }
        }
    </style>
</head>

<body>
    <ul id="items"></ul>
    <form id="newItemForm">
        <div>
            <input type="text" id="newItemInput" placeholder="Nieuw item toevoegen" required autocomplete="off">
            <button type="submit" class="plus-square"></button>
        </div>
    </form>
</body>
<script>
    class LocalData {
        #data = {}
        constructor(blank = {}) {
            let storedData = localStorage.getItem('boodschappenlijstgegevens');
            if (storedData) {
                this.#data = JSON.parse(storedData);
            } else {
                this.#data = blank;
                localStorage.setItem('boodschappenlijstgegevens', JSON.stringify(this.#data));
            }
        }

        set(key, value) {
            this.#data[key] = value;
            localStorage.setItem('boodschappenlijstgegevens', JSON.stringify(this.#data));
        }

        get(key) {
            return this.#data[key];
        }
    }

    let data = new LocalData({ items: {} })
    renderItems()

    document.querySelector('#newItemForm').addEventListener('submit', function (event) {
        event.preventDefault();
        let newItemInput = document.querySelector('#newItemInput');
        let newItem = newItemInput.value.trim();
        if (newItem) {
            let items = data.get('items') || {};
            items[newItem] = true; // true indicates the item is not yet completed
            data.set('items', items);
            newItemInput.value = '';
            renderItems();
        }
    });

    function renderItems() {
        let itemsList = document.querySelector('#items');
        itemsList.innerHTML = '';
        let items = data.get('items') || [];
        Object.keys(items)
            .filter(item => items[item]) // Only show items that are not completed
            .forEach((item) => {
                let li = document.createElement('li');
                li.innerText = item;
                li.addEventListener('click', function () {
                    li.classList.toggle('strikethrough');
                    items[li.innerText] = !items[li.innerText];
                    data.set('items', items);
                });
                itemsList.appendChild(li);
            });
    }
</script>

</html>
