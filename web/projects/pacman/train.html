<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man</title>
    <style>
        body {
            background: black;
        }

        table {
            margin-left: auto;
            margin-right: auto;
            border-spacing: 0;
        }

        td {
            background: black;
            color: white;
            width: 16px;
            height: 16px;
            padding: 0;
        }

        td.wall {
            background: blue;
        }

        img {
            display: block;
        }
    </style>
</head>

<body>
    <table>
        <tbody id="table"></tbody>
    </table>
</body>
<script src="./brain.js"></script>
<script>
    // provide optional config object (or undefined). Defaults shown.
    const config = {
        binaryThresh: 0.5,
        hiddenLayers: [3], // array of ints for the sizes of the hidden layers in the network
        activation: 'sigmoid', // supported activation types: ['sigmoid', 'relu', 'leaky-relu', 'tanh'],
        leakyReluAlpha: 0.01, // supported for activation type 'leaky-relu'
    };

    // create a simple feed-forward neural network with backpropagation
    const network = new brain.NeuralNetwork(config);

    // network.train([
    //     { input: [0, 0], output: [0] },
    //     { input: [0, 1], output: [1] },
    //     { input: [1, 0], output: [1] },
    //     { input: [1, 1], output: [0] },
    // ]);

    // const output = network.run([1, 0]); // [0.987]
    // console.log({ output })


    let data = []
    //Format: bit 1: wall type, bits 2-3: pellet type 
    const mapData = [
        "1111111111111111111111111111",
        "1000000000000110000000000001",
        "1011110111110110111110111101",
        "1011110111110110111110111101",
        "1011110111110110111110111101",
        "1000000000000000000000000001",
        "1011110110111111110110111101",
        "1011110110111111110110111101",
        "1000000110000110000110000001",
        "1111110111110110111110111111",
        "1111110111110110111110111111",
        "1111110110000000000110111111",
        "1111110110111111110110111111",
        "1111110110100000010110111111",
        "0000000000101111010000000000",
        "1111110110100000010110111111",
        "1111110110111111110110111111",
        "1111110110000000000110111111",
        "1111110110111111110110111111",
        "1111110110111111110110111111",
        "1000000000000110000000000001",
        "1011110111110110111110111101",
        "1011110111110110111110111101",
        "1000110000000000000000110001",
        "1110110110111111110110110111",
        "1110110110111111110110110111",
        "1000000110000110000110000001",
        "1011111111110110111111111101",
        "1011111111110110111111111101",
        "1000000000000000000000000001",
        "1111111111111111111111111111",
    ].map((row, y) =>
        row.split("").map((tile, x) => {
            return ((tile === "0" && !(x !== 6 && x !== 21 && y > 8 && y < 20)) ? 1 : 0) + Number(tile) * 4
        })
    )
    mapData[3][1]++
    mapData[3][26]++
    mapData[23][1]++
    mapData[23][26]++
    mapData[12][13]++
    mapData[12][14]++
    mapData[23][13]--
    mapData[23][14]--
    const sprites = {
        pacman: {
            x: 14,
            y: 23,
            dir: 2,
            speed: 6,
            moved: 0
        },
        blinky: {
            name: "blinky",
            x: 16,
            y: 13,
            dir: 2,
            target: {
                x: 25,
                y: 0
            },
            speed: 4,
            moved: 0,
            caught: false
        },
        pinky: {
            name: "pinky",
            x: 16,
            y: 15,
            dir: 3,
            target: {
                x: 2,
                y: 0
            },
            speed: 4,
            moved: 0,
            caught: false
        },
        inky: {
            name: "inky",
            x: 11,
            y: 15,
            dir: 0,
            target: {
                x: 27,
                y: 30
            },
            speed: 4,
            moved: 0,
            caught: false
        },
        clyde: {
            name: "clyde",
            x: 11,
            y: 13,
            dir: 1,
            target: {
                x: 0,
                y: 30
            },
            speed: 4,
            moved: 0,
            caught: false
        }
    }
    let ghostMode = 1 // 0: scatter, 1: chase, 2: frightened
    const table = document.getElementById("table")
    function setup() {
        for (let y = 0; y < 31; y++) {
            const tr = document.createElement("tr")
            for (let x = 0; x < 28; x++) {
                const td = document.createElement("td")
                if (mapData[y][x] >= 4) {
                    td.className = "wall"
                } else {
                    if (mapData[y][x] % 4 > 0) td.innerHTML = `<img src="./assets/pellet${mapData[y][x]}.png">`
                }
                tr.appendChild(td)
            }
            table.appendChild(tr)
        }
    }
    function getTile(pos) { return table.children[pos.y].children[pos.x] }
    function getMapData(pos) { return mapData[pos.y][pos.x] }
    function ahead(sprite, length = 1, dir = sprite.dir) { return { x: (28 + Math.round(sprite.x + Math.cos(Math.PI * dir / 2) * length)) % 28, y: Math.round(sprite.y + Math.sin(Math.PI * dir / 2) * length) } }
    function setTargets() {
        if (ghostMode === 1) {
            sprites.blinky.target = sprites.pacman
            sprites.pinky.target = ahead(sprites.pacman, 4)
            sprites.inky.target.x = 2 * ahead(sprites.pacman, 2).x - sprites.blinky.x
            sprites.inky.target.y = 2 * ahead(sprites.pacman, 2).y - sprites.blinky.y
            if ((sprites.clyde.x - sprites.pacman.x) ** 2 + (sprites.clyde.y - sprites.pacman.y) ** 2 > 64) {
                sprites.clyde.target = sprites.pacman
            } else {
                sprites.clyde.target = { x: 0, y: 30 }
            }
        }
        else {
            sprites.blinky.target = { x: 25, y: 0 }
            sprites.pinky.target = { x: 2, y: 0 }
            sprites.inky.target = { x: 27, y: 30 }
            sprites.clyde.target = { x: 0, y: 30 }
        }
    }
    async function tick() {
        let dirs = [0, 1, 2, 3].filter(dir => getMapData(ahead(sprites.pacman, 1, dir)) < 4)
        if (dirs.length > 2) {
            let inputs = Array(4).fill(0).map((v, i) => dirs.includes(i) ? 1 : 0).concat(sprites.pacman.x / 28, sprites.pacman.y / 31)
            getTile(ahead(sprites.pacman, 1, choose(inputs))).innerHTML = `<img src="./assets/arrow${dir}.png">`
            let dir = await new Promise(resolve => {
                window.addEventListener('keydown', e => {
                    let dir = ["ArrowRight", "ArrowDown", "ArrowLeft", "ArrowUp"].indexOf(e.key)
                    if (dirs.includes(dir)) resolve(dir)
                })
            })
            network.train([{ input: inputs, output: Array(4).fill(0).map((v, i) => dir === i ? 1 : 0) }])
            sprites.pacman.dir = dir
            dirs.forEach(dir => {
                getTile(ahead(sprites.pacman, 1, dir)).innerHTML = ""
            })
        } else {
            let backDirs = dirs.filter(v => v !== sprites.pacman.dir)
            if (backDirs.length === 2) {
                sprites.pacman.dir = backDirs[0] === (sprites.pacman.dir + 2) % 4 ? backDirs[1] : backDirs[0]
            }
        }
        let next = ahead(sprites.pacman)

        if (getMapData(next) < 4) {
            getTile(sprites.pacman).innerHTML = ""
            mapData[sprites.pacman.y][sprites.pacman.x] = getMapData(sprites.pacman) >> 2 << 2
            if (sprites.pacman.x === 27 && sprites.pacman.dir === 0) sprites.pacman.x = 0
            if (sprites.pacman.x === 0 && sprites.pacman.dir === 2) sprites.pacman.x = 27
            sprites.pacman = { ...sprites.pacman, ...next }
            getTile(sprites.pacman).innerHTML = `<img src="./assets/pacman${sprites.pacman.dir}.gif">`
        }
        // if (ghostMode > 0) setTargets()
        // let ghosts = [sprites.blinky, sprites.pinky, sprites.inky, sprites.clyde]

        // ghosts.forEach(ghost => {
        //     let dirs = [ghost.dir, (ghost.dir + 1) % 4, (ghost.dir + 3) % 4].filter(dir => getMapData(ahead(ghost, 1, dir)) < 4)
        //     if (dirs.length === 1) {
        //         ghost.dir = dirs[0]
        //     } else {
        //         let tiles = dirs.map(v => {
        //             let tile = ahead(ghost, 1, v)
        //             return (tile.x - ghost.targetx) ** 2 + (tile.y - ghost.targety) ** 2
        //         })
        //         ghost.dir = dirs[tiles.indexOf(Math.min(...tiles))]
        //     }
        //     getTile(ghost).innerHTML = getMapData(ghost) % 4 ? `<img src="./assets/pellet${getMapData(ghost) % 4}.png">` : ""
        //     if (ghost.x === 26 && ghost.dir === 0) ghost.x = 0
        //     if (ghost.x === 1 && ghost.dir === 2) ghost.x = 27
        //     sprites[ghost.name] = { ...ghost, ...ahead(ghost) }
        //     if (ghost.name === "blinky") console.log(ghost.x, sprites.blinky.x)
        //     getTile(sprites[ghost.name]).innerHTML = `<img src="./assets/${ghost.name}.png">`
        //     if (ghost.x === sprites.pacman.x && ghost.y === sprites.pacman.y) gameOver()
        // })
        // if (getMapData(ahead(sprites.pacman)) < 4) tick()
        tick()
    }

    async function choose(...args) {
        return [0, 1, 2, 3].indexOf(Math.max(...network.run([...args])))
    }


    function gameOver() {
        clearInterval(gameLoop)
        for (let sprite of Object.values(sprites)) {
            getTile(sprite).innerHTML = getMapData(sprite) % 4 ? `<img src="./assets/pellet${getMapData(sprite) % 4}.png">` : ""
        }
    }
    setup()
    getTile(sprites.pacman).innerHTML = `<img src="./assets/pacman2.gif">`
    // let gameLoop = setInterval(tick, 10)
    // window.addEventListener("click", tick)
    tick()



</script>

</html>
