<div id="outputDiv">
    <h3>Decrypted Message:</h3>

    <p id="outputText" style="word-wrap: break-word;"></p>
</div>
</div>

<script>
    let cipherText = ""
    let columns = []
    let key, length
    let spaces = true
    const nonLetters = ["", "\n", " ", ".", ",", "!", "?", "'", "-", ":", "’"]

    document.getElementById("ctInput").onchange = () => {
        console.log(document.getElementById("ctInput").value)
        cipherText = document.getElementById("ctInput").value.toUpperCase().split("").filter(v => !nonLetters.includes(v))
        length = cipherText.length
    }

    document.getElementById("lengthInput").onchange = () => {
        key = document.getElementById("lengthInput").value.split("").map(v => v.charCodeAt(0))
        length = key.length
        // length = parseInt(document.getElementById("lengthInput").value)
        decrypt()
    }

    document.getElementById("nextButton").onclick = () => {
        length += 1
        decrypt()
    }

    function decrypt() {
        columns = []
        cipherText
            .forEach((v, i) => {
                let column = key[i%length]
                columns[column] = columns[column] || []
                columns[column][Math.floor(i / length)] = v
            })



        columns = columns
            .map(v => v.reduce((a, b) => a + b, "") + spaces ? " ":"")
            .reduce((a, b) => a + b, "")

        document.getElementById("outputText").innerHTML = columns
    }


</script>
