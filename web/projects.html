            "title": "Logical Proof",
            "status": "complete",
            "type": "other",
            "desc": "Recently I have been revising for my Computer Science entrance exam for TU Delft. One part of this test is about logic, including propositional logic, Boolean algebra, logic circuits, predicate logic and logical deduction. Whilst studying this, I was allocated some lesson time to code up some data structures, although I had already done this earlier for every structure I needed to know about. Instead, I decided to make this program, combining OOP and expression trees with formal proof, deduction and simplification of logical propositions. You can enter an argument (a series of propositions which you claim lead to a conclusion) and the program will prove that the argument is valid or find a counter-example to disprove it.        <br><br>        To use the program, first enter the conclusion of the argument, and then add each premise individually below. The logic input supports propositonal variables (formed of upper and lowercase letters and underscores) and 5 logical operators: Negation (not), Conjunction (and), Disjunction (or), Implication and Biconditionality. You can also input a tautology (a proposition which is always true) by typing T,        true or 1, and likewise a contradiction (always false) by typing F,        false or 0. Finally press the Prove button to prove or disprove the argument.        <br><br>        The first thing that happens is all logical symbols are standardised. Then, the input is tokenised - propositional variables are grouped together to form atomic units while operators are split up. The tokens are then converted to postfix notation using the shunting yard algorithm (see my Train Calculator for more info) and finally an expression tree is built. This is an instance of the Proposition class. Each premise is then wrapped in a Deduction object (which stores a proposition known to be true, the other deductions that imply this, and a description of how the link was made) and stored in an array inside an Argument object.        <br><br>        The first attempt at proving the argument is a direct proof, which makes a series of logical steps to deduce the conclusion from the premises. The array of premises is iterated through, and each deduction is considered individually as well as paired with every other deduction. At this stage, standard rules of deduction such as Modus Ponens (if (p → q) is true and p is true then q is also true) are applied to deduce new propositions.        <br><br>        When new propositions are deduced, they are also simplified. This works by performing a depth-first post-order traversal of the expression tree, and applying the laws of Boolean Algebra such as de Morgan's Law (¬(p ∨ q) === ¬p ∧ ¬q) to each stage of the tree. This is repeated until the simplification becomes idempotent, that is simplying the tree yields the same tree that you started with. This simplified proposition is added to the list of deductions as well.        <br><br>        This process repeats, breaking down propositions and deducing new ones until hopefully the conclusion falls out of the logic. In this case, the program takes the deduction that deduced the conclusion and retraces the steps that were taken to get there, by recursively looking at the premises of the deduction until it reaches the premises of the argument. These are then formatted and displayed to the user. However, it might reach a state where the conclusion hasn't been reached but no new information can be deduced. In this event, the program tries again, this time using proof by contradiction.        <br><br>        A new deduction is made equivalent to the negation of the conclusion, and added to the list. The goal of the function now is not to reach the conclusion, but to reach a contradiction. This would imply that the conclusion is always true, since (assuming the conclusion is false) is always false. The same process of deductions is made, terminating if a contradiction is found.        <br><br>        If the proof by contradiction also falls short, then it is likely that the argument is not actually valid after all, and it is impossible to prove. The algorithm tries to disprove the argument by finding a counter-example, a configuration of truth values that make all of the premises true but the conclusion false. The primitive propositional variables are first isolated, and then the list of deductions is scanned to see if any of them are known to be true or false. The program then takes any variables which are unknown and constructs a truth table of every possible assignment of true/false values to them. In each case, it computes the truth value of the conclusion and each of the premises making use of another post-order recursive function evaluate(). If it ever finds a permutation which makes all premises true but not the conclusion, then it has found a counter-example, which is output to the user. If it does not succeed this time either, then it has proven the argument valid by exhaustion.",
